[package]
name = "ailfred"
version = "0.1.0"
edition = "2024"

# The app at the root; its engine and conversation model, without UI, in crates/ailfred-core;
# the wire protocol its clients speak (AG-UI events), in crates/ailfred-protocol.
[workspace]
members = ["crates/ailfred-core", "crates/ailfred-protocol"]
resolver = "3"

[dependencies]
ailfred-core = { path = "crates/ailfred-core" }
# Saved replies keep their AG-UI events.
ailfred-protocol = { path = "crates/ailfred-protocol" }
block2 = "0.6"
# Computer control's dialogs run on the main queue (already built through objc2).
dispatch2 = { version = "0.3", default-features = false, features = ["std"] }
# Computer control's screenshots go to the model as JPEG (Rune already builds this crate).
image = { version = "0.25", default-features = false, features = ["jpeg"] }
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "libc", "NSAlert", "NSApplication", "NSButton", "NSControl", "NSEvent", "NSGraphics", "NSResponder", "NSRunningApplication", "NSView", "NSWindow", "NSWorkspace"] }
# The Accessibility API: what computer control's guards read under a point.
objc2-application-services = { version = "0.3.2", default-features = false, features = ["std", "libc", "AXError", "AXUIElement", "AXValue", "HIServices"] }
objc2-core-foundation = "0.3.2"
objc2-core-graphics = "0.3.2"
objc2-core-text = "0.3.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSGeometry", "NSNotification", "NSString", "NSURL", "NSURLRequest", "NSValue"] }
objc2-screen-capture-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-core-graphics", "SCShareableContent", "SCStream", "SCScreenshotManager", "libc"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecItem", "SecBase"] }
objc2-service-management = "0.3.2"
# The web view window (T21): a WKWebView showing the React client in web/.
objc2-web-kit = { version = "0.3.2", default-features = false, features = [
    "std", "block2", "objc2-app-kit", "objc2-core-foundation", "WKFrameInfo", "WKNavigation", "WKNavigationAction", "WKNavigationDelegate", "WKPreferences",
    "WKScriptMessage", "WKScriptMessageHandler", "WKUIDelegate", "WKUserContentController", "WKWebView", "WKWebViewConfiguration",
    "WKWindowFeatures",
] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rune = { version = "0.0.1", path = "../_references/rune/crates/rune", features = ["native-file-dialog"] }
rune-kit = { version = "0.0.1", path = "../_references/rune/crates/rune-kit", features = ["markdown"] }
tray-icon = "0.26"

[dev-dependencies]
# The local server's tests hold every line it sends to the official AG-UI schema.
ailfred-protocol = { path = "crates/ailfred-protocol", features = ["testing"] }

# Rune ships patched copies of these crates; a dependency's `[patch]` doesn't apply to the
# workspace that depends on it, so an app that builds Rune repeats them.
[patch.crates-io]
wgpu-hal = { path = "../_references/rune/vendor/wgpu-hal" }
winit = { path = "../_references/rune/vendor/winit" }
parley_engine = { path = "../_references/rune/vendor/parley_engine" }
accesskit_windows = { path = "../_references/rune/vendor/accesskit_windows" }

# Line tables keep backtraces small; full debug info for Rune costs many GB of RAM.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
incremental = true
