[package]
name = "ailfred-protocol"
version = "0.1.0"
edition = "2024"
description = "Ailfred's wire protocol: the conversation as AG-UI 1.0 events, and the commands clients send back."

[dependencies]
ailfred-core = { path = "../ailfred-core" }
# The JSON Schemas the TypeScript and Swift clients generate their types from.
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
