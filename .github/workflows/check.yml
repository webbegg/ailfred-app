name: check

# Only what needs no Mac: the UI-free crates (ailfred-core, ailfred-protocol) on Linux, for
# each pull request and each push to master. macOS runners are slow to get and costly, so the
# app itself is checked locally: `scripts/check` is the gate before every commit.
# Rune is a path dependency beside the repository (../_references/rune) that the workspace's
# manifest names, so the job checks it out there, at the commit RUNE_REV names (nothing of it
# is built here). Bump RUNE_REV when the app needs a newer Rune.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNE_REV: 21e5342b9a4cc33eeee88071b4b1f0eafb1247d4
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ailfred-app
    steps:
      - uses: actions/checkout@v4
        with:
          path: ailfred-app
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/rune
          ref: ${{ env.RUNE_REV }}
          path: _references/rune
      # rustup installs the toolchain rust-toolchain.toml names (with clippy) on first use.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ailfred-app
      - name: The core crates stay UI-free
        run: |
          for crate in ailfred-core ailfred-protocol; do
            if cargo tree --locked -p "$crate" -e normal --prefix none | grep -E '^(rune|objc2)'; then
              echo "$crate depends on Rune or objc2" >&2
              exit 1
            fi
          done
      - name: clippy
        run: cargo clippy --locked -p ailfred-core -p ailfred-protocol --all-targets -- -D warnings
      - name: test
        run: cargo test --locked -p ailfred-core -p ailfred-protocol
