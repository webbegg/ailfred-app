name: check

# scripts/check (build, clippy with warnings as errors, tests) on a Mac, for each pull request
# and each push to master. Rune is a path dependency beside the repository
# (../_references/rune): the job checks it out there, at the commit RUNE_REV names. Bump
# RUNE_REV when the app needs a newer Rune.
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch: a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  RUNE_REV: 21e5342b9a4cc33eeee88071b4b1f0eafb1247d4
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          path: ailfred-app
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/rune
          ref: ${{ env.RUNE_REV }}
          path: _references/rune
      # rustup installs the toolchain rust-toolchain.toml names (with clippy) on first use.
      - name: Toolchain
        working-directory: ailfred-app
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ailfred-app
          key: rune-${{ env.RUNE_REV }}
      - name: scripts/check
        working-directory: ailfred-app
        run: scripts/check
